<!-- Body markup for the DeepSeek Harness chat webview. The host wraps this in
     its own document shell; no html/head/script/link elements belong here. -->
<div id="app" class="app">
  <header id="header" class="header">
    <div class="header-titles">
      <span id="folder-name" class="folder-name" title="">repository</span>
      <span class="title-sep" aria-hidden="true">/</span>
      <span id="session-title" class="session-title" title="Current session">New session</span>
    </div>
    <div class="header-actions">
      <button id="runtime-badge" class="runtime-badge state-idle" type="button" title="Runtime diagnostics" aria-label="Runtime state, open diagnostics">
        <span class="runtime-dot" aria-hidden="true"></span>
        <span id="runtime-label" class="runtime-label">idle</span>
      </button>
      <button id="btn-new-session" class="icon-button" type="button" title="New session" aria-label="New session">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M8 3.25v9.5M3.25 8h9.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-sessions" class="icon-button" type="button" title="Show sessions" aria-label="Show sessions" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M3 4.5h10M3 8h10M3 11.5h6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-web-ui" class="icon-button" type="button" title="Open the DSH web UI for this repository" aria-label="Open web UI">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="5.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2.9 8h10.2M8 2.9c1.5 1.5 2.2 3.2 2.2 5.1S9.5 11.6 8 13.1C6.5 11.6 5.8 9.9 5.8 8S6.5 4.4 8 2.9Z" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button id="btn-reveal-data" class="icon-button" type="button" title="Reveal data directory" aria-label="Reveal data directory">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M1.9 12.4V4.3c0-.5.4-.9.9-.9h3.1l1.2 1.5h6.1c.5 0 .9.4.9.9v6.6c0 .5-.4.9-.9.9H2.8a.9.9 0 0 1-.9-.9Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-select-folder" class="icon-button" type="button" title="Select repository folder" aria-label="Select repository folder" hidden>
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M1.9 12.4V4.3c0-.5.4-.9.9-.9h3.1l1.2 1.5h6.1c.5 0 .9.4.9.9v6.6c0 .5-.4.9-.9.9H2.8a.9.9 0 0 1-.9-.9Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 6.6v4.2M6 8.7h4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div id="meta-line" class="meta-line">
    <span id="model-label" class="meta-model" data-action="select-model" role="button" tabindex="0"
      title="Active model — click to choose another"></span>
    <span id="permission-label" class="meta-perm" title="Permission mode"></span>
  </div>

  <section id="session-panel" class="session-panel" aria-label="Sessions" hidden>
    <div class="panel-head">
      <span class="panel-title">Sessions</span>
      <span class="panel-spacer"></span>
      <button id="btn-refresh-sessions" class="icon-button" type="button" title="Refresh sessions" aria-label="Refresh sessions">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M13 8a5 5 0 1 1-1.6-3.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13.2 2.6v2.7h-2.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-close-sessions" class="icon-button" type="button" title="Hide sessions" aria-label="Hide sessions">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ul id="session-list" class="session-list"></ul>
    <div class="panel-foot">
      <button id="btn-diagnostics" class="link-button" type="button">Diagnostics</button>
      <button id="btn-restart-runtime" class="link-button" type="button">Restart runtime</button>
    </div>
  </section>

  <div class="transcript-wrap">
    <main id="transcript" class="transcript" tabindex="0" aria-label="Transcript" aria-live="polite">
      <div id="empty-state" class="empty-state">
        <div class="empty-title">DeepSeek Harness</div>
        <p class="empty-text">Ask the agent to explore, edit, or explain this repository.</p>
        <ul class="empty-hints">
          <li><span class="kbd">Enter</span> send</li>
          <li><span class="kbd">Shift</span>+<span class="kbd">Enter</span> newline</li>
          <li><span class="kbd">Esc</span> stop the running turn</li>
          <li>Paste images to attach them</li>
        </ul>
      </div>
      <div id="working" class="working" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span class="working-text">Working</span>
        <span id="working-elapsed" class="working-elapsed">0:00</span>
        <span class="working-hint">Esc to stop</span>
      </div>
    </main>
    <button id="jump-latest" class="jump-latest" type="button" hidden>
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false"><path d="M4 6.5 8 10.5l4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Jump to latest</span>
    </button>
  </div>

  <footer id="composer" class="composer">
    <div id="context-chips" class="context-chips" hidden></div>
    <div class="composer-box">
      <textarea id="composer-input" class="composer-input" rows="1" spellcheck="false"
        placeholder="Ask DeepSeek Harness…" aria-label="Prompt"></textarea>
      <div class="composer-actions">
        <button id="btn-attach" class="icon-button" type="button" title="Attach the current editor selection" aria-label="Attach current editor selection">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M9.8 4.6 5.4 9a1.9 1.9 0 0 0 2.7 2.7l4.6-4.6a3.4 3.4 0 0 0-4.8-4.8L2.7 7.5a4.9 4.9 0 0 0 0 6.9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0.6 -0.4) scale(0.86)"/></svg>
        </button>
        <button id="btn-files" class="icon-button" type="button" title="Mention files" aria-label="Mention files">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M8 1.9 14 5.2 8 8.5 2 5.2 8 1.9Z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="M2 8.2 8 11.5l6-3.3M2 11.1 8 14.4l6-3.3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
        </button>
        <span id="usage" class="usage" hidden></span>
        <span class="composer-spacer"></span>
        <button id="btn-send" class="primary-button" type="button" disabled>
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false"><path d="M8 12.5v-9M4 7.3 8 3.3l4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Send</span>
        </button>
        <button id="btn-stop" class="danger-button" type="button" hidden>
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false"><rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.2" fill="currentColor"/></svg>
          <span>Stop</span>
        </button>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
